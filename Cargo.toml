[package]
name = "ragd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
arrow-array = "58"
arrow-schema = "58"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
ignore = "0.4.33"
lancedb = { version = "0.39.0", features = ["remote"] }
notify-debouncer-mini = "0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_arrow = { version = "0.15.1", features = ["arrow-58"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
