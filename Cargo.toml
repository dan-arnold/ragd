[package]
name = "ragd"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "58"
arrow-schema = "58"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
lancedb = { version = "0.39.0", features = ["remote"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_arrow = { version = "0.15.1", features = ["arrow-58"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
