name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Avoid `ld` running out of disk/memory while linking the large dependency
  # graph (lancedb/arrow-flight/tonic + tree-sitter grammars): use the
  # lighter-weight lld linker and skip debug info for CI builds.
  RUSTFLAGS: -C link-arg=-fuse-ld=lld
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protoc and lld
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
